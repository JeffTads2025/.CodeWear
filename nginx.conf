events {}

http {
  server_tokens off;

  server {
    listen 80;
    server_name localhost codewear.local;

    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost codewear.local;

    ssl_certificate /etc/nginx/certs/codewear.local.pem;
    ssl_certificate_key /etc/nginx/certs/codewear.local-key.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https://codewear.local wss://codewear.local ws://codewear.local https://localhost:5173 wss://localhost:5173 ws://localhost:5173; img-src 'self' data: blob: https:; font-src 'self' data: https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /api/ {
      proxy_pass http://backend:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
